<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>login</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="login.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
    </head>
        
    <body class="login">
        <div class="login__preview">
            <span class="login__heading">Войти</span>
            <img src="./images/login/login.svg" alt="login-photo" class="login__photo">
        </div>
        <form action="index.php" class="login__form">
            <div class="panel">
                <span class="panel__headline-input">Электропочта</span>
                <input type="email" class="panel__input">
                <span class="panel__subtitle-input">Введите электропочту в формате *****@***.**</span>
            </div>
            <div class="panel">
                <span class="panel__headline-input">Пароль</span>
                <div class="panel__password-form">
                    <input type="password" class="panel__input"> 
                    <img src="./images/icon/Eye.svg" alt="Eye" class="panel__icon-password">
                </div>
            </div>
            <input type="submit" value="Продолжить" class="login__button">       
        </form>
    </body>
</html>
