<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>home</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="home.css">
        <link rel="stylesheet" href="tab.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body class="home">
        <div class="tab">
            <div class="tab__menu">
                <img src="./images/icon/house-item.svg" alt="house-item" class="tab__item">
                <img src="./images/icon/human-item.svg" alt="human-item" class="tab__item">
                <img src="./images/icon/plus-item.svg" alt="plus-item" class="tab__item">
            </div>
        </div>

        <div class="lenta">
            <div class="post">
                <span class="post__head-post">
                    <span class="post__user-avatar">
                        <img src="./images/first-post/first-avatar.svg" alt="human" class="post__image-user">
                        <span class="post__name">Ваня Денисов</span>
                    </span>
                    <img src="./images/icon/pen.svg" alt="pen" class="post__image-pen">
                </span>
                <div class="post__slider">
                    <img src="./images/first-post/first-photo.png" alt="photo" class="post__photo">
                    <span class="post__counter-photo">1/3</span>
                </div>
                <div class="post__likes">
                    <img src="./images/icon/heart.svg" alt="heart" class="post__heart">
                    <span class="post__counter-hearts">203</span>
                </div>
                <div class="post__description">
                    <span class="post__text">Так красиво сегодня на улице! Настоящая зима)) Вспоминается Бродский: «Поздно ночью, 
                        в уснувшей долине, на самом дне, в гор...»
                    </span>
                    <span class="post__button-open">ещё</span>
                    <span class="post__date">2 часа назад</span>
                </div>
            </div>
            
            <div class="post">
                <span class="post__head-post">
                    <span class="post__user-avatar">
                        <img src="./images/second-post/second-avatar.svg" alt="human" class="post__image-user">
                        <span class="post__name">Лиза Дёмина</span>
                    </span>
                </span>
                <div class="post__slider">
                    <img src="./images/second-post/second-photo.jpg" alt="photo" class="post__photo">
                </div>
                <div class="post__likes">
                    <img src="./images/icon/heart.svg" alt="heart" class="post__heart">
                    <span class="post__counter-hearts">90</span>
                </div>
                <div class="post__description">
                    <span class="post__text">Чуваки!! Сейчас на ужин рыбки прикупила))))»</span>
                    <span class="post__button-open">ещё</span>
                    <span class="post__date">2 дня назад</span>
                </div>
            </div>
        </div>
    </body>
</html>
